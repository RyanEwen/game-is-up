# nginx site for gamesup.app, installed by `npm run deploy:prod` as gamesup.conf in the
# server's shared nginx container (CTR-8): the deploy tests it with nginx -t and restores the
# previous file if the test fails. It proxies to the containers in compose.server.yml by name.
# Cloudflare terminates public HTTPS; this origin accepts HTTP.
map $http_upgrade $gamesup_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    access_log /var/log/nginx/sites/gamesup.access.log main;
    server_name gamesup.app;
    resolver 127.0.0.11 valid=30s ipv6=off;

    # The visitor's address is taken from CF-Connecting-IP only when the request really comes from
    # Cloudflare (ranges from https://www.cloudflare.com/ips/, 2026-11-10); anyone reaching the server
    # directly is identified by their own address, so the API's per-client rate limits can't be dodged.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Cloudflare terminates HTTPS, so the public scheme is always https; $scheme here is http.
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $gamesup_connection_upgrade;
    proxy_redirect off;

    # Route API requests directly so the web container cannot replace the public scheme with HTTP.
    location /api/ {
        set $gamesup_api game-is-up-api;
        proxy_pass http://$gamesup_api:4000;
    }
    location / {
        set $gamesup_web game-is-up-web;
        proxy_pass http://$gamesup_web:8080;
    }
}
