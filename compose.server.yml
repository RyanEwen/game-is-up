# Production stack (CONF-11), tracked and deployed by `npm run deploy:prod`. Secrets and the
# public origin come from the untracked .env beside it (see .env.server.example). A value that
# only one host needs goes in an untracked compose.override.yml, which the deploy adds.
#
# One image (DIST-12, root Dockerfile): the api service runs the API, which also serves the built
# web app. nginx (a separate container on the shared nginx_default network) reaches it by its
# container name (see nginx.server.conf), so no port is published here.

# Caps each container's log at 50 MB (5 files of 10 MB), so a noisy or crash-looping
# container cannot fill the server's disk. Every service references this anchor.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

# Hardening every service shares (CTR-7).
x-hardening: &hardening
  security_opt: ['no-new-privileges:true']

services:
  db:
    <<: *hardening
    container_name: game-is-up-db
    logging: *default-logging
    image: postgres:16-bookworm
    restart: unless-stopped
    # Measured about 35 MiB and 7 processes; limits leave headroom and come from the env file.
    mem_limit: ${DB_MEM_LIMIT:-512m}
    memswap_limit: ${DB_MEM_LIMIT:-512m}
    pids_limit: ${DB_PIDS_LIMIT:-256}
    environment:
      POSTGRES_DB: game_is_up
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d game_is_up']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    <<: *hardening
    container_name: game-is-up-api
    logging: *default-logging
    build:
      context: .
      args:
        # The web app's build-time settings; empty VITE_API_BASE_URL keeps it on the same origin.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_PUBLIC_APP_URL: ${VITE_PUBLIC_APP_URL:-}
        # The commit and version the deploy validated, for the image's OCI labels (CTR-1).
        REVISION: ${DEPLOY_REVISION:-unknown}
        VERSION: ${DEPLOY_VERSION:-unknown}
    restart: unless-stopped
    # Measured about 58 MiB and 29 processes; limits leave headroom and come from the env file.
    mem_limit: ${API_MEM_LIMIT:-512m}
    memswap_limit: ${API_MEM_LIMIT:-512m}
    pids_limit: ${API_PIDS_LIMIT:-128}
    # Forwards stop signals to the API and reaps child processes.
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/game_is_up?schema=public
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?set CLIENT_ORIGIN (the public URL) in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      DISCORD_TOKEN_KEY: ${DISCORD_TOKEN_KEY:?set DISCORD_TOKEN_KEY in .env (openssl rand -base64 32)}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY:-}
      DISCORD_CALLBACK_URL: ${DISCORD_CALLBACK_URL:?set DISCORD_CALLBACK_URL in .env}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_BOT_MODE: ${DISCORD_BOT_MODE:-gateway}
      DISCORD_SERVER_ID: ${DISCORD_SERVER_ID:-}
      STEAM_CALLBACK_URL: ${STEAM_CALLBACK_URL:-}
      STEAM_WEB_API_KEY: ${STEAM_WEB_API_KEY:-}
      RAWG_API_KEY: ${RAWG_API_KEY:-}
      ADMIN_HANDLES: ${ADMIN_HANDLES:-}
      # Self-hosted, cookieless Umami analytics; on only when both are set (apps/api/src/lib/analytics.ts).
      UMAMI_SCRIPT_URL: ${UMAMI_SCRIPT_URL:-}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      # Migrations run before the API listens.
      start_period: 60s
    networks:
      - default
      - nginx_default

volumes:
  postgres-data:

networks:
  nginx_default:
    external: true
