# Example reverse-proxy config for a public Game's Up deployment.
# Replace the certificate paths and upstream name to match your environment.

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  server_name gamesup.example.com;

  listen 80;
  listen 443 ssl http2;

  ssl_certificate /letsencrypt/live/example.com/fullchain.pem;
  ssl_certificate_key /letsencrypt/live/example.com/privkey.pem;

  if ($scheme != "https") {
    return 301 https://$host$request_uri;
  }

  resolver 127.0.0.11 valid=30s ipv6=off;

  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_cache off;
  proxy_read_timeout 1h;
  proxy_send_timeout 1h;

  location / {
    set $upstream game-is-up-web;
    proxy_pass http://$upstream:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Scheme $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_cache_bypass $http_upgrade;
    chunked_transfer_encoding off;
    proxy_redirect off;
  }
}