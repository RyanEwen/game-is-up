services:
  workspace:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    user: node
    # Run tini as PID 1 so orphaned child processes are reaped instead of
    # accumulating as zombies (a bare `sleep infinity` PID 1 never calls wait()).
    init: true
    command: sleep infinity
    working_dir: /workspace/game-is-up
    volumes:
      - ..:/workspace/game-is-up:cached
    # ports:
    #   - "4000:4000"
    #   - "5173:5173"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: game_is_up
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d game_is_up"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres-data: