# Persistence overlay merged into the base compose by the devcontainer CLI.
# Generated by the shared `persist` helper; re-run it to regenerate rather
# than editing this file by hand.
services:
  workspace:
    environment:
      HISTFILE: /commandhistory/.bash_history
      PROMPT_COMMAND: 'history -a; history -c; history -r'
    volumes:
      - game-is-up-config-data:/home/node/.config
      - game-is-up-codex-data:/home/node/.codex
      - game-is-up-vscode-server:/home/node/.vscode-server/extensions
      - codex-agent-sdk:/home/node/.vscode-server/data/agent-host
      - game-is-up-agent-sessions:/home/node/.vscode-server/data/agentSessionData
      - game-is-up-bash-history:/commandhistory
      - ${HOME}/.ssh:/home/node/.ssh:ro
      # Codex loads global instructions from ~/.codex/AGENTS.md. Mount the host file
      # over the persistent Codex volume so host and devcontainer sessions share it.
      - ${HOME}/.codex/AGENTS.md:/home/node/.codex/AGENTS.md:rw
volumes:
  game-is-up-config-data:
    name: ${DEVCONTAINER_CONFIG_VOLUME:-game-is-up-config-data}
  game-is-up-codex-data:
    name: ${DEVCONTAINER_CODEX_DATA_VOLUME:-game-is-up-codex-data}
  game-is-up-vscode-server:
    name: ${DEVCONTAINER_VSCODE_SERVER_VOLUME:-game-is-up-vscode-server}
  codex-agent-sdk:
    name: ${DEVCONTAINER_CODEX_AGENT_SDK_VOLUME:-codex-agent-sdk}
  game-is-up-agent-sessions:
    name: ${DEVCONTAINER_AGENT_SESSIONS_VOLUME:-game-is-up-agent-sessions}
  game-is-up-bash-history:
    name: ${DEVCONTAINER_BASH_HISTORY_VOLUME:-game-is-up-bash-history}
