# Copy this file to compose.yml for a real deployment and keep the
# server-specific copy out of git.

# Caps each container's log at 50 MB (5 files of 10 MB), so a noisy or crash-looping
# container cannot fill the server's disk. Every service references this anchor.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  db:
    logging: *default-logging
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: game_is_up
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d game_is_up']
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    logging: *default-logging
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/game_is_up?schema=public
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY:-}
      DISCORD_CALLBACK_URL: ${DISCORD_CALLBACK_URL:-http://localhost:8080/api/auth/discord/callback}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_BOT_MODE: ${DISCORD_BOT_MODE:-gateway}
      DISCORD_SERVER_ID: ${DISCORD_SERVER_ID:-}
      STEAM_CALLBACK_URL: ${STEAM_CALLBACK_URL:-}
      STEAM_WEB_API_KEY: ${STEAM_WEB_API_KEY:-}
      RAWG_API_KEY: ${RAWG_API_KEY:-}
      ADMIN_HANDLES: ${ADMIN_HANDLES:-}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    logging: *default-logging
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_PUBLIC_APP_URL: ${VITE_PUBLIC_APP_URL:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${PORT:-8080}:8080'

volumes:
  postgres-data:
