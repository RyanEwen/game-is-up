services:
  db:
    container_name: game-is-up-db

  api:
    container_name: game-is-up-api
    environment:
      DISCORD_SERVER_ID: ${DISCORD_SERVER_ID:-}

  web:
    container_name: game-is-up-web
    ports: []
    networks:
      - default
      - nginx_default

networks:
  nginx_default:
    external: true