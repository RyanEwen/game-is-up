name: CI

# Runs the local gate (npm run validate: format, lint, typecheck, unit tests, Prisma schema),
# the database integration tests against a disposable Postgres, and a build of both production
# images, on every push to main and every pull request. No path filter: every change is
# checked (CI-1).
on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default (CI-5); no job here needs more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    # The gate takes a few minutes; the cap stops a hung test or database wait early.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: game_is_up_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d game_is_up_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # The API validates its environment on import, so tests need these. The database is the
    # disposable service above; the integration tests refuse any database not named *_test.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/game_is_up_test?schema=public
      CLIENT_ORIGIN: http://localhost:5173
      SESSION_SECRET: ci-only-session-secret-not-used-anywhere

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate the Prisma client
        run: npm run db:generate

      - name: Validate
        run: npm run validate

      - name: Apply migrations to the test database
        run: npm run db:migrate:deploy

      - name: Integration tests
        run: npm run test:integration

  # The production image is built only at deploy time otherwise, so a Dockerfile break would
  # surface on the server. Build it here (no push) to catch it on every change.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build the production image
        run: docker build --tag game-is-up:ci .
